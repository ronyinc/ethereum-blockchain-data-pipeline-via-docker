name: dbt prod Deploy

on:
  push:
    branches: [ "master" ]   # runs after PR merge (push to master)
  workflow_dispatch:

concurrency:
  group: dbt-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DBT_ETH

    env:
      DBT_PRIVATE_KEY: ${{ secrets.DBT_PRIVATE_KEY }}
      DBT_PRIVATE_KEY_PATH: /home/runner/.dbt/rsa_key.p8
      DBT_SNOWFLAKE_IDENTIFIER: ${{ secrets.DBT_SNOWFLAKE_IDENTIFIER }}
      DBT_SNOWFLAKE_ROLE: ${{ secrets.DBT_SNOWFLAKE_ROLE }}
      DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11.6"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.11.10 dbt-snowflake==1.11.5

      - name: Set up dbt profile + private key
        run: |
          mkdir -p ~/.dbt
          cp .dbt/profiles.yml ~/.dbt/profiles.yml
          echo "$DBT_PRIVATE_KEY" > ~/.dbt/rsa_key.p8
          chmod 600 ~/.dbt/rsa_key.p8

      - name: dbt deps
        run: dbt deps --target prod

      - name: Parse project
        run: dbt parse --target prod

      - name: Create state manifest from dev 
        run: |
          git checkout dev
          dbt deps
          dbt parse --target prod
          mkdir -p state
          cp target/manifest.json state/manifest.json
          git checkout master

      - name: Show modified nodes
        run: |
          dbt ls --target prod --state ./state --select state:modified+

      - name: Slim ci build (modified +  downstream)
        run: |
          dbt build --target prod --state ./state --defer --select "state:modified+"              